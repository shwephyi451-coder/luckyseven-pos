<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuckySeven POS</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background: #f4f6f8; }
    header { background: #166534; color: #fff; padding: 14px 16px; font-size: 18px; font-weight: bold; }
    .container { max-width: 680px; margin: 14px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h3 { margin: 0 0 10px; font-size: 16px; }
    input, button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; }
    button { background: #166534; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    button.secondary { background: #1d4ed8; }
    button.gray { background: #475569; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e2e8f0; gap: 8px; }
    .row:last-child { border-bottom: none; }
    .total { font-size: 18px; font-weight: bold; margin-top: 8px; }
    .small { font-size: 13px; color: #64748b; }
    .status { font-size: 13px; padding: 6px 10px; border-radius: 6px; background: #ecfdf5; color: #166534; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>LuckySeven POS</header>
  <div class="container">
    <div id="dbStatus" class="status">Turso Database သို့ ချိတ်ဆက်နေသည်...</div>

    <div class="card">
      <h3>ပစ္စည်းအသစ် ထည့်ရန် (Stock)</h3>
      <input id="itemName" type="text" placeholder="ပစ္စည်းအမည်" />
      <input id="itemPrice" type="number" placeholder="ရောင်းဈေး (ကျပ်)" />
      <input id="itemQty" type="number" placeholder="အရေအတွက်" />
      <button onclick="addItem()">Stock ထည့်မည်</button>
    </div>

    <div class="card">
      <h3>ပစ္စည်းစာရင်း (နှိပ်ပြီး ရောင်းချပါ)</h3>
      <div id="stockList" class="small">ပစ္စည်းစာရင်း ယူနေသည်...</div>
    </div>

    <div class="card">
      <h3>လက်ရှိ ဘေလ်စာရင်း (Cart)</h3>
      <div id="cartList" class="small">ရွေးချယ်ထားသော ပစ္စည်း မရှိသေးပါ။</div>
      <div class="total">စုစုပေါင်း: <span id="cartTotal">0</span> ကျပ်</div>
      <button class="secondary" onclick="checkout()">အရောင်း ပြီးစီးမည် (Checkout)</button>
      <button class="gray" onclick="clearCart()">Cart ရှင်းမည်</button>
    </div>

    <div class="card">
      <h3>ယနေ့ စုစုပေါင်း ရောင်းရငွေ</h3>
      <div class="total"><span id="todaySales">0</span> ကျပ်</div>
    </div>
  </div>

  <script>
    // Turso Connection (LuckySeven)
    const TURSO_URL = "https://luckseven-luckyseven.aws-ap-southeast-1.turso.io";
    const TURSO_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoiRW50aXR5IiwiaWF0IjoxNzYzOTQ5NDU1LCJpZCI6ImM2N2I2ZWIzLTY0M2YtNGM0Zi04MTY5LWU1M2U4MWRlM2M0YyJ9.pL719-K9xKHGzaKRzOyiMu1XuJg8PEEyXPhB8BlJmvoA-4KHwEl04fgutjVRzrR2kdAsgF_YmRoiLVMPcxX-Dw";

    let items = [];
    let cart = [];
    let todaySales = 0;

    function getTodayKey() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    async function queryTurso(sql, args = []) {
      const res = await fetch(`${TURSO_URL}/v2/pipeline`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${TURSO_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          requests: [
            {
              type: "execute",
              stmt: {
                sql,
                args: args.map(v =>
                  typeof v === "number"
                    ? { type: "integer", value: String(v) }
                    : { type: "text", value: String(v) }
                )
              }
            },
            { type: "close" }
          ]
        })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.message || "Turso connection failed");
      }
      const first = data.results && data.results[0];
      if (first && first.type === "error") {
        throw new Error(first.error.message || "SQL Error");
      }
      return first && first.response ? first.response.result : null;
    }

    async function initDB() {
      const statusEl = document.getElementById("dbStatus");
      try {
        await queryTurso(`
          CREATE TABLE IF NOT EXISTS items (
            id INTEGER PRIMARY KEY,
            name TEXT NOT NULL,
            price INTEGER NOT NULL,
            qty INTEGER NOT NULL
          )
        `);
        await queryTurso(`
          CREATE TABLE IF NOT EXISTS sales (
            sale_date TEXT PRIMARY KEY,
            total INTEGER NOT NULL
          )
        `);
        await loadFromTurso();
        statusEl.textContent = "Turso Database (luckyseven) နှင့် ချိတ်ဆက်ပြီးပါပြီ ✓";
      } catch (err) {
        console.error(err);
        statusEl.style.background = "#fef2f2";
        statusEl.style.color = "#b91c1c";
        statusEl.textContent = "Turso ချိတ်ဆက်မှု အမှားရှိနေသည်: " + err.message;
      }
    }

    async function loadFromTurso() {
      const itemRes = await queryTurso("SELECT id, name, price, qty FROM items ORDER BY id DESC");
      items = (itemRes && itemRes.rows ? itemRes.rows : []).map(r => ({
        id: Number(r[0].value),
        name: r[1].value,
        price: Number(r[2].value),
        qty: Number(r[3].value)
      }));

      const today = getTodayKey();
      const saleRes = await queryTurso("SELECT total FROM sales WHERE sale_date = ?", [today]);
      if (saleRes && saleRes.rows && saleRes.rows.length > 0) {
        todaySales = Number(saleRes.rows[0][0].value);
      } else {
        todaySales = 0;
      }

      render();
    }

    async function addItem() {
      const name = document.getElementById("itemName").value.trim();
      const price = Number(document.getElementById("itemPrice").value);
      const qty = Number(document.getElementById("itemQty").value);

      if (!name || price <= 0 || qty <= 0) {
        alert("ပစ္စည်းအမည်၊ ဈေးနှုန်းနှင့် အရေအတွက် မှန်ကန်စွာ ထည့်ပါ။");
        return;
      }

      const id = Date.now();
      await queryTurso("INSERT INTO items (id, name, price, qty) VALUES (?, ?, ?, ?)", [id, name, price, qty]);

      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemQty").value = "";

      await loadFromTurso();
    }

    function addToCart(id) {
      const item = items.find(x => x.id === id);
      if (!item || item.qty <= 0) {
        alert("လက်ကျန် မရှိတော့ပါ။");
        return;
      }

      const existing = cart.find(x => x.id === id);
      if (existing) {
        if (existing.count >= item.qty) {
          alert("လက်ကျန်ထက် ကျော်လွန်နေပါသည်။");
          return;
        }
        existing.count += 1;
      } else {
        cart.push({ id: item.id, name: item.name, price: item.price, count: 1 });
      }
      render();
    }

    function clearCart() {
      cart = [];
      render();
    }

    async function checkout() {
      if (cart.length === 0) {
        alert("ရောင်းချမည့် ပစ္စည်း ရွေးပါ။");
        return;
      }

      let billTotal = 0;
      for (const c of cart) {
        const item = items.find(x => x.id === c.id);
        if (!item || item.qty < c.count) {
          alert(`${c.name} လက်ကျန် မလုံလောက်ပါ။`);
          return;
        }
        const newQty = item.qty - c.count;
        await queryTurso("UPDATE items SET qty = ? WHERE id = ?", [newQty, item.id]);
        billTotal += c.price * c.count;
      }

      const today = getTodayKey();
      const newTodaySales = todaySales + billTotal;
      await queryTurso(
        `INSERT INTO sales (sale_date, total) VALUES (?, ?)
         ON CONFLICT(sale_date) DO UPDATE SET total = excluded.total`,
        [today, newTodaySales]
      );

      cart = [];
      await loadFromTurso();
      alert("အရောင်း ပြီးစီးပါပြီ။ ကျသင့်ငွေ: " + billTotal.toLocaleString() + " ကျပ်");
    }

    function render() {
      const stockEl = document.getElementById("stockList");
      if (items.length === 0) {
        stockEl.innerHTML = '<div class="small">ပစ္စည်း မရှိသေးပါ။</div>';
      } else {
        stockEl.innerHTML = items.map(i => `
          <div class="row">
            <div>
              <strong>${i.name}</strong><br/>
              <span class="small">${Number(i.price).toLocaleString()} ကျပ် | လက်ကျန်: ${i.qty}</span>
            </div>
            <button style="width:auto;margin:0;padding:8px 14px;" onclick="addToCart(${i.id})">ရောင်းမည်</button>
          </div>
        `).join("");
      }

      const cartEl = document.getElementById("cartList");
      let total = 0;
      if (cart.length === 0) {
        cartEl.innerHTML = '<div class="small">ရွေးချယ်ထားသော ပစ္စည်း မရှိသေးပါ။</div>';
      } else {
        cartEl.innerHTML = cart.map(c => {
          const sub = c.price * c.count;
          total += sub;
          return `<div class="row"><span>${c.name} x ${c.count}</span><strong>${sub.toLocaleString()} ကျပ်</strong></div>`;
        }).join("");
      }

      document.getElementById("cartTotal").textContent = total.toLocaleString();
      document.getElementById("todaySales").textContent = todaySales.toLocaleString();
    }

    initDB();
  </script>
</body>
</html>
